# nginx configuration for CN Project — Edge / Reverse Proxy + Load Balancer
# Mac2 — TLS termination on port 8443 with round-robin load balancing
#
# IMPORTANT: Replace placeholders before deploying:
#   <Mac3_IP>       = Mac3's LAN IP (Backend A, port 3001)
#   <Mac1_IP>       = Mac1's LAN IP (Backend B, port 3002)
#   <YOUR_USERNAME> = Mac2's username (run: whoami)
#
# Deployment:
#   1. Back up original: cp "$(brew --prefix)/etc/nginx/nginx.conf" ~/CN-Project/nginx/nginx.conf.backup
#   2. Copy this file:   sudo cp nginx.conf "$(brew --prefix)/etc/nginx/nginx.conf"
#   3. Syntax check:     nginx -t
#   4. Start/reload:     brew services start nginx   OR   nginx -s reload

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /opt/homebrew/var/log/nginx/access.log;
    error_log   /opt/homebrew/var/log/nginx/error.log;

    # Upstream: round-robin load balancing across Backend A and Backend B
    upstream backend_pool {
        server <Mac3_IP>:3001;   # Backend A (Mac3)
        server <Mac1_IP>:3002;   # Backend B (Mac1)
    }

    # HTTPS server — TLS termination on port 8443
    server {
        listen 8443 ssl;
        server_name app.teamX.test;

        # TLS certificate (generated by Mac2)
        ssl_certificate     /Users/<YOUR_USERNAME>/CN-Project/tls/app.teamX.test.crt;
        ssl_certificate_key /Users/<YOUR_USERNAME>/CN-Project/tls/app.teamX.test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Reverse proxy to backend pool
        location / {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
