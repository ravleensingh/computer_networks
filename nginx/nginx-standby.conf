worker_processes 1;
events { worker_connections 1024; }

http {
  include mime.types;
  default_type application/octet-stream;

  upstream backend_pool {
    server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;   # Backend A (on localhost for Mac3)
    server <Mac1_IP>:3002 max_fails=1 fail_timeout=5s;   # Backend B (on Mac1)
  }

  server {
    listen 8443 ssl;
    server_name app.teamX.test;

    ssl_certificate     /Users/<YOUR_USERNAME>/CN-Project/tls/app.teamX.test.crt;
    ssl_certificate_key /Users/<YOUR_USERNAME>/CN-Project/tls/app.teamX.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_next_upstream error timeout;
    }
  }
}
