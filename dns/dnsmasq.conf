# dnsmasq configuration for CN Project
# Mac1 — Private DNS Server
#
# IMPORTANT: Replace the placeholder IPs before starting:
#   <Mac1_LAN_IP> = Mac1's LAN IP (this machine's IP on en0/en1)
#   <Mac2_IP>     = Mac2's LAN IP (the edge/nginx machine)
#
# To find your IP:  ipconfig getifaddr en0
# To validate:      dnsmasq --test -C ~/CN-Project/dns/dnsmasq.conf
# To start:         sudo dnsmasq --keep-in-foreground --conf-file=$HOME/CN-Project/dns/dnsmasq.conf

port=53
listen-address=<Mac1_LAN_IP>
bind-interfaces
no-resolv

# Upstream fallback DNS for non-project domains
server=1.1.1.1

# Project DNS records — all point to the edge (Mac2)
address=/app.teamX.test/<Mac2_IP>
address=/api.teamX.test/<Mac2_IP>
address=/teamX.test/<Mac2_IP>

# DNS cache
cache-size=150

# Logging
log-queries
log-facility=-
